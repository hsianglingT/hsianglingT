    <main id="making-a-form">
      <div>
        <h1>Survey</h1>
        <form method="post" action="https://formspree.io/f/meoajvww">
          <div>
            <label for="name_field">What is your name? <abbr title="required" aria-label="required">*</abbr></label>
            <input type="text" name="name_field" id="name_field" required>
          </div>
          <div>
            <label for="email_field">What is your email? <abbr title="required" aria-label="required">*</abbr></label>
            <input type="email" name="email_field" id="email_field" required>
          </div>
          <div>
            <label for="best_whole_number">Which whole number is best? </label>
            <input type="number" name="best_whole_number" id="best_whole_number" min="0">
          </div>
          <div>
            <label for="best_day">Which day is best? </label>
            <input type="date" name="best_day" id="best_day">
          </div>
          <div>
            <label for="best_bear">Which bear is best? <abbr title="required" aria-label="required">*</abbr></label>
            <select name="best_bear" id="best_bear" aria-required="true" required>
              <option value="" selected> </option>
              <option value="black">Black</option>
              <option value="brown">Brown</option>
              <option value="care">Care</option>
              <option value="panda">Panda</option>
              <option value="polar">Polar</option>
              <option value="teddy">Teddy</option>
            </select>
          </div>
          <div>
            <fieldset>
              <legend>Do you like radio buttons? </legend>
              <ul>
                <li>
                  <input type="radio" name="enjoys_radio_buttons" value="yes" id="enjoys_radio_buttons_yes">
                  <label for="enjoys_radio_buttons_yes">Yes</label>
                </li>
                <li>
                  <input type="radio" name="enjoys_radio_buttons" value="no" id="enjoys_radio_buttons_no">
                  <label for="enjoys_radio_buttons_no">No</label>
                </li>
                <li>
                  <input type="radio" name="enjoys_radio_buttons" value="?" id="enjoys_radio_buttons_default" checked>
                  <label for="enjoys_radio_buttons_default">None of your business</label>
                </li>
              </ul>
            </fieldset>
          </div>
          <div>
            <label for="life_meaning">What is the meaning of life? </label>
            <textarea name="life_meaning" id="life_meaning" rows="5" cols="50"
              placeholder="Enter the correct answer here."></textarea>
          </div>
          <div>
            <button type="submit">Send</button>
          </div>
        </form>
      </div>
    </main>
